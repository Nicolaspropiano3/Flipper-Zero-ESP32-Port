name: Build vin_decoder FAP

on:
  workflow_dispatch:
  push:
    paths:
      - 'applications_user/vin_decoder/**'
      - '.github/workflows/build-vin-decoder.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Build full firmware first
        run: |
          . $IDF_PATH/export.sh
          ./build.sh

      - name: Build the FAP
        run: |
          . $IDF_PATH/export.sh
          ./buildFap.sh applications_user/vin_decoder

      - name: Show real error on failure
        if: failure()
        run: |
          find . -path '*/log/idf_py_std*_output_*' -exec echo "== {} ==" \; -exec cat {} \;

      - name: Upload FAP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vin_decoder-fap
          path: '**/vin_decoder.fap'
