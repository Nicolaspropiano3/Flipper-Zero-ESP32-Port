name: Build vin_decoder FAP

on:
  workflow_dispatch:
  push:
    paths:
      - 'applications_user/vin_decoder/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build full firmware first
        run: |
          . $IDF_PATH/export.sh
          ./build.sh

      - name: Build the FAP
        run: |
          . $IDF_PATH/export.sh
          ./buildFap.sh applications_user/vin_decoder

      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: vin_decoder-fap
          path: '**/vin_decoder.fap'
